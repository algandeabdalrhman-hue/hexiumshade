name: HexiumShade iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/test-access-2026-11-17

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild -list -project HexiumShade.xcodeproj

      - name: Build iOS arm64
        run: |
          xcodebuild \
            -project HexiumShade.xcodeproj \
            -target HexiumShade \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      - name: Find compiled library
        run: |
          mkdir -p output
          find ~/Library/Developer/Xcode/DerivedData build \
            -name "libHexiumShade.dylib" \
            -type f \
            -exec cp {} output/ \; 2>/dev/null || true
          test -f output/libHexiumShade.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexiumShade-iOS-arm64
          path: output/libHexiumShade.dylib
