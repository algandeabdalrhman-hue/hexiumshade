name: HexiumShade iOS App Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/test-access-2026-11-17

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project HexiumShade.xcodeproj

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project HexiumShade.xcodeproj \
            -target HexiumShade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/HexiumShade.app"
          test -d "$APP_PATH"
          mkdir -p output
          cd build/Build/Products/Release-iphoneos
          /usr/bin/zip -r "$GITHUB_WORKSPACE/output/HexiumShade-unsigned.zip" HexiumShade.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexiumShade-iOS-app-unsigned
          path: output/HexiumShade-unsigned.zip
