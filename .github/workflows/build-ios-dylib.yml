name: SHADES iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Xcode
        run: xcodebuild -version
      - name: List project targets
        run: xcodebuild -list -project HexiumShade.xcodeproj
      - name: Build SHADES app
        run: |
          xcodebuild \
            -project HexiumShade.xcodeproj \
            -target SHADESApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build
      - name: Package app
        run: |
          mkdir -p output
          APP_PATH="$(find build/DerivedData -type d -name 'SHADESApp.app' -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" output/SHADES.app
          test -s output/SHADES.app/SHADESApp
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHADES-iOS-arm64
          path: output/SHADES.app
