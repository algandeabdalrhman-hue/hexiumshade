name: HexiumShade iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project HexiumShade.xcodeproj

      - name: Build iOS arm64
        run: |
          xcodebuild \
            -project HexiumShade.xcodeproj \
            -scheme HexiumShade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      - name: Find compiled library
        run: |
          mkdir -p output
          find build/DerivedData -name "libHexiumShade.dylib" -type f -exec cp {} output/ \;
          test -s output/libHexiumShade.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexiumShade-iOS-arm64
          path: output/libHexiumShade.dylib
